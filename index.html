<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <section id="product-list">
            <!-- 商品列表將由 JS 動態產生 -->
        </section>
        <section id="cart-modal" class="hidden">
            <div class="cart-content">
                <h2>Cart</h2>
                <ul id="cart-items">
                    <!-- 購物車項目由 JS 動態產生 -->
                </ul>
                <div class="cart-total">
                    Total: <span id="cart-total">$0</span>
                </div>
                <button id="close-cart">Close</button>
            </div>
        </section>
    </main>
    
    <!-- 固定在右下角的購物車按鈕 -->
    <div id="fixed-cart-btn">
        <button id="cart-btn">
            <img src="src/car.png" alt="Shopping Cart" id="cart-icon">
            <span id="cart-count">0</span>
        </button>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
